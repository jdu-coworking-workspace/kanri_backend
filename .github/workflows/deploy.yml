name: Test va EC2 ga backend deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cowork_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cowork_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cowork_test_db
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cowork_test_db
          JWT_SECRET_KEY: ci-only-secret
          CORS_ORIGIN: http://localhost:3000
          S3_MODE: local
        run: PYTHONPATH=. pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create artifact
        run: |
          tar -czf backend.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='media' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            alembic.ini migrations requirements.txt src

      - name: Upload artifact to S3
        run: |
          aws s3 cp backend.tar.gz \
            "s3://${{ vars.DEPLOY_BUCKET }}/deploy/backend-${{ github.sha }}.tar.gz"

      - name: Deploy on EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ARTIFACT_KEY: deploy/backend-${{ github.sha }}.tar.gz
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "backend ${{ github.sha }}" \
            --parameters commands="/usr/local/bin/kanri-deploy-backend.sh $ARTIFACT_KEY" \
            --query Command.CommandId --output text)

          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          test "$STATUS" = "Success" || {
            echo "Deploy status: $STATUS"
            exit 1
          }
