# Bitta domen. Frontend: https://DOMEN/   API: https://DOMEN/api/
# DOMEN: cowork.jdu.uz  yoki  portfolio.cowork.jdu.uz
# server_name va backend CORS_ORIGIN bir xil host bo'lsin.
#
# Bu fayl Certbot dan OLDIN. Faqat 80-port.
# DNS shu serverga qaraganidan keyin:
#   sudo certbot --nginx -d cowork.jdu.uz
# Certbot 443 va HTTP→HTTPS redirectni o'zi qo'shadi. location bloklarini o'chirmang.

# Login ga brute force uchun cheklov (README 10.2 ga qarang).
limit_req_zone $binary_remote_addr zone=kanri_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cowork.jdu.uz;

    server_tokens off;

    # Backend limiti 5 MB. Multipart qo'shimchasi uchun ozroq zapas.
    client_max_body_size 8m;

    # Avatarlar productionda S3 dan keladi (brauzer to'g'ridan-to'g'ri).
    # /media/ bloki kerak emas.

    location = /api/v1/auth/login {
        limit_req zone=kanri_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI /api/v1/...  — proxy_pass oxirida slash YO'Q, path saqlanadi.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # uvicorn --proxy-headers shu qatorni o'qiydi. 307 redirect va
        # request.url ning sxemasi shunga qarab https bo'ladi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js. `next start` websocket ishlatmaydi (HMR faqat devda),
    # shuning uchun Upgrade/Connection sarlavhalari kerak emas.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
